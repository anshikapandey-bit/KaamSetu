openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: KaamSetu local work marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: marketplace
  - name: workers
  - name: applications
  - name: trust
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /demo-status:
    get:
      operationId: getDemoStatus
      tags: [marketplace]
      summary: Get current storage and demo-mode status
      responses:
        "200":
          description: Storage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoStatus"
  /dashboard:
    get:
      operationId: getDashboardSummary
      tags: [marketplace]
      summary: Get marketplace overview counts
      responses:
        "200":
          description: Marketplace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /jobs:
    get:
      operationId: listJobs
      tags: [marketplace]
      summary: List and search local job listings
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: skill
          in: query
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Job listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [marketplace]
      summary: Create a job listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Listing created; employer remains unverified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid listing
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [marketplace]
      summary: Get a job listing
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Listing not found
  /jobs/{jobId}/matches:
    get:
      operationId: listJobMatches
      tags: [workers]
      summary: Find workers whose skills and location fit a job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Matching worker profiles with reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerMatch"
        "404":
          description: Listing not found
  /jobs/{jobId}/applications:
    post:
      operationId: applyToJob
      tags: [applications]
      summary: Express interest in a job
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid application or duplicate
        "404":
          description: Job or worker not found
  /jobs/{jobId}/flags:
    post:
      operationId: flagJob
      tags: [trust]
      summary: Flag a suspicious listing for human review
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobFlagInput"
      responses:
        "201":
          description: Listing queued for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobFlag"
        "404":
          description: Listing not found
  /review-queue:
    get:
      operationId: listReviewQueue
      tags: [trust]
      summary: List listings awaiting human review
      responses:
        "200":
          description: Pending reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewQueueItem"
  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List worker profiles
      parameters:
        - name: skill
          in: query
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Worker profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
    post:
      operationId: createWorker
      tags: [workers]
      summary: Create a worker profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          description: Invalid profile
  /workers/{workerId}:
    get:
      operationId: getWorker
      tags: [workers]
      summary: Get a worker profile
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Worker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Worker not found
    patch:
      operationId: updateWorker
      tags: [workers]
      summary: Update a worker profile
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerUpdate"
      responses:
        "200":
          description: Updated worker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          description: Invalid profile
        "404":
          description: Worker not found
  /workers/{workerId}/matches:
    get:
      operationId: listWorkerMatches
      tags: [marketplace]
      summary: Find jobs matching a worker profile
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Matched listings with explanations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobMatch"
        "404":
          description: Worker not found
  /workers/{workerId}/applications:
    get:
      operationId: listWorkerApplications
      tags: [applications]
      summary: List a worker's applications
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Applications and their current statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationView"
        "404":
          description: Worker not found
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications for the employer workspace
      responses:
        "200":
          description: Applications with worker and job information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationView"
  /applications/{applicationId}:
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Accept or decline an application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
        "400":
          description: Invalid status
        "404":
          description: Application not found
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    WorkerId:
      name: workerId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    DemoStatus:
      type: object
      properties:
        storage: { type: string, enum: [database, memory] }
        isDemoMode: { type: boolean }
        notice: { type: string }
      required: [storage, isDemoMode, notice]
    DashboardSummary:
      type: object
      properties:
        totalJobs: { type: integer }
        workerProfiles: { type: integer }
        applications: { type: integer }
        successfulConnections: { type: integer }
        pendingReview: { type: integer }
      required: [totalJobs, workerProfiles, applications, successfulConnections, pendingReview]
    Worker:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        skills:
          type: array
          items: { type: string }
        location: { type: string }
        experienceYears: { type: integer }
        expectedDailyWage: { type: integer }
        availability: { type: string }
        createdAt: { type: string, format: date-time }
        isDemo: { type: boolean }
      required: [id, name, skills, location, experienceYears, expectedDailyWage, availability, createdAt, isDemo]
    WorkerInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        skills:
          type: array
          minItems: 1
          items: { type: string, minLength: 2, maxLength: 50 }
        location: { type: string, minLength: 2, maxLength: 120 }
        experienceYears: { type: integer, minimum: 0, maximum: 70 }
        expectedDailyWage: { type: integer, minimum: 1, maximum: 1000000 }
        availability: { type: string, minLength: 2, maxLength: 120 }
      required: [name, skills, location, experienceYears, expectedDailyWage, availability]
    WorkerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        skills:
          type: array
          minItems: 1
          items: { type: string, minLength: 2, maxLength: 50 }
        location: { type: string, minLength: 2, maxLength: 120 }
        experienceYears: { type: integer, minimum: 0, maximum: 70 }
        expectedDailyWage: { type: integer, minimum: 1, maximum: 1000000 }
        availability: { type: string, minLength: 2, maxLength: 120 }
    Job:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        requiredSkills:
          type: array
          items: { type: string }
        location: { type: string }
        paymentMin: { type: integer }
        paymentMax: { type: integer }
        paymentUnit: { type: string, enum: [day, job] }
        workDate: { type: string, format: date }
        employerName: { type: string }
        employerVerification: { type: string, enum: [unverified] }
        postedAt: { type: string, format: date-time }
        isDemo: { type: boolean }
      required: [id, title, description, requiredSkills, location, paymentMin, paymentMax, paymentUnit, workDate, employerName, employerVerification, postedAt, isDemo]
    JobInput:
      type: object
      properties:
        title: { type: string, minLength: 4, maxLength: 100 }
        description: { type: string, minLength: 10, maxLength: 1000 }
        requiredSkills:
          type: array
          minItems: 1
          items: { type: string, minLength: 2, maxLength: 50 }
        location: { type: string, minLength: 2, maxLength: 120 }
        paymentMin: { type: integer, minimum: 1, maximum: 1000000 }
        paymentMax: { type: integer, minimum: 1, maximum: 1000000 }
        paymentUnit: { type: string, enum: [day, job] }
        workDate: { type: string, format: date }
        employerName: { type: string, minLength: 2, maxLength: 100 }
      required: [title, description, requiredSkills, location, paymentMin, paymentMax, paymentUnit, workDate, employerName]
    JobMatch:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/Job"
        score: { type: integer, minimum: 0, maximum: 100 }
        reasons:
          type: array
          items: { type: string }
      required: [job, score, reasons]
    WorkerMatch:
      type: object
      properties:
        worker:
          $ref: "#/components/schemas/Worker"
        score: { type: integer, minimum: 0, maximum: 100 }
        reasons:
          type: array
          items: { type: string }
      required: [worker, score, reasons]
    Application:
      type: object
      properties:
        id: { type: string }
        workerId: { type: string }
        jobId: { type: string }
        status: { type: string, enum: [pending, accepted, declined] }
        createdAt: { type: string, format: date-time }
      required: [id, workerId, jobId, status, createdAt]
    ApplicationView:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            workerName: { type: string }
            jobTitle: { type: string }
            employerName: { type: string }
            location: { type: string }
            paymentMin: { type: integer }
            paymentMax: { type: integer }
            paymentUnit: { type: string, enum: [day, job] }
          required: [workerName, jobTitle, employerName, location, paymentMin, paymentMax, paymentUnit]
    ApplicationInput:
      type: object
      properties:
        workerId: { type: string, minLength: 1 }
      required: [workerId]
    ApplicationUpdate:
      type: object
      properties:
        status: { type: string, enum: [accepted, declined] }
      required: [status]
    JobFlag:
      type: object
      properties:
        id: { type: string }
        jobId: { type: string }
        reason: { type: string }
        status: { type: string, enum: [pending_review, in_review, resolved] }
        createdAt: { type: string, format: date-time }
      required: [id, jobId, reason, status, createdAt]
    JobFlagInput:
      type: object
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [reason]
    ReviewQueueItem:
      allOf:
        - $ref: "#/components/schemas/JobFlag"
        - type: object
          properties:
            job:
              $ref: "#/components/schemas/Job"
          required: [job]
